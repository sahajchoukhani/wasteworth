<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" fill="none">
  <defs>
    <linearGradient id="bgForm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E3D4D"/>
      <stop offset="65%" stop-color="#092C38"/>
      <stop offset="100%" stop-color="#051B22"/>
    </linearGradient>
    <linearGradient id="formGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D997"/>
      <stop offset="50%" stop-color="#C69D52"/>
      <stop offset="100%" stop-color="#876121"/>
    </linearGradient>
    <linearGradient id="formTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#227991"/>
      <stop offset="100%" stop-color="#0B3644"/>
    </linearGradient>
    <filter id="formShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="14" dy="24" stdDeviation="20" flood-color="#031217" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="800" height="960" fill="url(#bgForm)"/>
  <!-- Travertine gallery plinth -->
  <rect x="60" y="640" width="680" height="320" fill="#EAE0D0"/>
  <rect x="60" y="640" width="680" height="16" fill="#F5EFE6"/>
  <line x1="60" y1="640" x2="740" y2="640" stroke="url(#formGold)" stroke-width="2"/>
  <!-- Architectural Monolith Trophy -->
  <g filter="url(#formShadow)">
    <rect x="170" y="575" width="170" height="65" fill="#141D21" stroke="url(#formGold)" stroke-width="2"/>
    <path d="M255 210 L325 320 L295 575 L215 575 L185 320 Z" fill="url(#formTeal)" stroke="url(#formGold)" stroke-width="3"/>
    <path d="M255 210 L325 320 L255 430 Z" fill="url(#formGold)" fill-opacity="0.35"/>
    <path d="M200 350 Q255 325 308 380" stroke="#68BFD1" stroke-width="3.5" stroke-opacity="0.45" fill="none"/>
  </g>
  <!-- Fluted Planter -->
  <g filter="url(#formShadow)">
    <path d="M430 430 L630 430 L600 640 L460 640 Z" fill="#F5EFE6" stroke="url(#formGold)" stroke-width="2.5"/>
    <line x1="470" y1="430" x2="485" y2="640" stroke="#C69D52" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="510" y1="430" x2="515" y2="640" stroke="#C69D52" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="550" y1="430" x2="545" y2="640" stroke="#C69D52" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="590" y1="430" x2="575" y2="640" stroke="#C69D52" stroke-opacity="0.35" stroke-width="2"/>
    <!-- Botanical leaf inside planter -->
    <path d="M530 430 C530 350 580 300 615 280 C595 340 565 390 530 430 Z" fill="#175A6E"/>
    <path d="M530 430 C520 340 480 280 445 250 C460 325 495 385 530 430 Z" fill="#0E3D4D"/>
  </g>
  <!-- Desk Nameplate -->
  <g filter="url(#formShadow)">
    <polygon points="310,605 520,605 505,640 295,640" fill="#092C38" stroke="url(#formGold)" stroke-width="2"/>
    <rect x="330" y="618" width="160" height="4" fill="url(#formGold)" opacity="0.8"/>
  </g>
</svg>